receivers:
  otlp:
    protocols:
      grpc:
        endpoint: otel-collector:4317

processors:
  filter:
    metrics:
      exclude:
        match_type: expr
        expressions:
#          - 'MetricName == "unwanted_metric_name"'
          # Or filter based on attributes
#          - attributes["http.request.operation"] == "GET: /metrics"
#          - attributes["http.request.operation"] == "GET: /swagger/v1/swagger.json"
          - attributes["http.target"] == "/metrics"
          - attributes["url.path"] == "/metrics"
          - attributes["http_request_operation"] == '"GET:/metrics"'


exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    metric_expiration: 5m
#    const_labels:
#      env: development

extensions:
  health_check:
    endpoint: otel-collector:13133
#  pprof:
#    endpoint: :1888
#  zpages:
#    endpoint: :55679

service:
  extensions: [health_check]
  #extensions: [pprof, zpages, health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [filter]
      exporters: [prometheus]