services:

  otel-collector:
    image: otel/opentelemetry-collector:0.77.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector http://localhost:8888/metrics
      - "8889:8889"   # Prometheus exporter metrics http://localhost:8889/metrics
      - "13133:13133" # health_check extension http://localhost:13133/
      - "4317:4317"   # OTLP gRPC receiver

  prometheus:
    image: prom/prometheus:latest
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"
#    links:
#      - mysqld-exporter
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./demo_service_rules.production.yml:/etc/prometheus/rules/demo_service_rules.production.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=1y'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  mysqld:
    image: mysql:8.0
    container_name: mysqld
    environment:
#      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "root"
#      MYSQL_USER: exporter
#      MYSQL_PASSWORD: exporter
    volumes:
      - ./mysql/setup.sql:/docker-entrypoint-initdb.d/setup.sql
      - mysql-data:/var/lib/mysql
#      - ~/var/mysql:/var/lib/mysql
    ports:
      - "33006:3306"

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    volumes:
      - exporter-data:/mysqld-exporter
      - ./mysql/config.my-cnf:/cfg/config.my-cnf
    command:
      - '--collect.info_schema.tablestats'
      - '--collect.info_schema.processlist'
#      - '--collect.perf_schema.memory_events'
#      - '--mysqld.username=exporter:exporter'
#      - '--mysqld.address=mysqld:33006'
      - '--config.my-cnf=/cfg/config.my-cnf'
#      - '--web.listen-address=:9104'
#      - '--web.telemetry-path=/metrics'
    environment:
      - DATA_SOURCE_NAME=exporter:exporter@(mysqld:33006)/
    ports:
      - "9104:9104"
#    links:
#      - mysqld
    depends_on:
      - mysqld

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
#    links:
#      - prometheus
    depends_on:
        - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug

  renderer:
    image: grafana/grafana-image-renderer:latest
    ports:
      - "8081"

volumes:
  prometheus-data: {}
  grafana-data: {}
  mysql-data: {}
  exporter-data: {}