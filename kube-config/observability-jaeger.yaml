apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data-pvc
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaegertracing
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaegertracing
  template:
    metadata:
      labels:
        app: jaegertracing
    spec:
      containers:
        - name: jaegertracing
          image: jaegertracing/all-in-one:1.75.0
          ports:
            - containerPort: 16686
            - containerPort: 14268
            - containerPort: 4317
            - containerPort: 6831
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 16686
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: jaeger-data
              mountPath: /jaeger-tracing
            - name: jaeger-tmp
              mountPath: /jaeger-tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: jaeger-data
          persistentVolumeClaim:
            claimName: jaeger-data-pvc
        - name: jaeger-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jaegertracing
  namespace: observability
spec:
  selector:
    app: jaegertracing
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30086
    - name: traces-http
      port: 14268
      targetPort: 14268
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: agent-udp
      port: 6831
      targetPort: 6831
      protocol: UDP
  type: NodePort


